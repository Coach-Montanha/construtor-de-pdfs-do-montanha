<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A26" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#EAB308" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="goldFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="goldFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="centerAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#EAB308" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#centerAura)" />

  <!-- Subtle Outer Hairline Accent -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Central Emblem: Mountain Peaks & Open Editorial Magazine -->
  <g filter="url(#shadowGlow)" transform="translate(0, -10)">
    <!-- Right Magazine Stack Pages -->
    <path d="M 330 185 L 350 195 L 350 275 L 330 265 Z" fill="url(#goldFacetRight)" opacity="0.6" />
    <path d="M 342 191 L 362 201 L 362 270 L 342 260 Z" fill="url(#goldFacetRight)" opacity="0.4" />

    <!-- Open Book Curved Base Wings -->
    <path d="M 130 285 C 190 265, 235 272, 256 295 C 277 272, 322 265, 382 285 L 382 298 C 322 278, 277 285, 256 308 C 235 285, 190 278, 130 298 Z" fill="url(#goldSheen)" />

    <!-- Left Mountain / Page Flap Facet -->
    <polygon points="256,120 205,178 205,282 256,295" fill="url(#goldFacetLeft)" />
    <!-- Center High Peak Spine -->
    <polygon points="256,120 256,295 307,282 307,178" fill="url(#goldFacetRight)" />

    <!-- Outer Left Mountain Peak -->
    <polygon points="205,178 145,285 205,282" fill="url(#goldFacetLeft)" opacity="0.9" />
    <polygon points="145,285 180,218 205,245 205,282" fill="url(#goldSheen)" />

    <!-- Outer Right Magazine Peak & Fold -->
    <polygon points="307,178 307,282 367,285" fill="url(#goldFacetRight)" opacity="0.9" />
    <polygon points="307,178 335,225 367,285" fill="url(#goldSheen)" />

    <!-- Core Dynamic Inverted 'M' Cutout -->
    <polygon points="256,165 230,225 256,260 282,225" fill="#0B0F19" />
    <polygon points="256,180 240,225 256,248 272,225" fill="url(#goldSheen)" opacity="0.85" />
  </g>

  <!-- Typography: Modern, Sleek, Editorial -->
  <text x="256" y="382" text-anchor="middle" fill="url(#goldSheen)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="8">MONTANHA</text>
  <text x="256" y="416" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="6">MAGAZINE STUDIO</text>
  <text x="256" y="442" text-anchor="middle" fill="#EAB308" opacity="0.6" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" letter-spacing="3">DIGITAL EDITION</text>
</svg>
